<script>
(function(){
  var scene = document.getElementById('scene');
  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (still || !('IntersectionObserver' in window)) { scene.classList.add('is-in'); return; }
  var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting) { scene.classList.add('is-in'); io.disconnect(); } }); }, { threshold: .35 });
  io.observe(scene);
})();

(function(){
  var root = document.querySelector('[data-pricing]'); if (!root) return;
  var st = { annual: false, price: 59, custom: false };
  var priceEl = root.querySelector('[data-paid-price]'), subEl = root.querySelector('[data-paid-sub]'), noteEl = root.querySelector('[data-paid-note]'), cta = root.querySelector('[data-paid-cta]');
  var bill = root.querySelectorAll('[data-billing]'), bands = root.querySelectorAll('[data-band]');
  function money(n){ return '$' + Math.round(n).toLocaleString('en-US'); }
  function render(){
    if (st.custom) { priceEl.innerHTML = '<small class="pre">from</small>$199<small>a month</small>'; noteEl.textContent = 'Custom setup for larger accounts.'; cta.textContent = 'Talk to us'; cta.href = '/contact/'; return; }
    var p = st.annual ? Math.round(st.price * 0.8) : st.price;
    priceEl.innerHTML = '$' + p + '<small>a month</small>';
    noteEl.textContent = st.annual ? 'Billed ' + money(st.price * 12 * 0.8) + ' a year. You save 20%.' : 'Billed monthly. Cancel anytime.';
    cta.textContent = 'Start 30-day trial'; cta.href = 'https://app.7captur.com/signup';
  }
  bill.forEach(function(b){ b.addEventListener('click', function(){ st.annual = b.getAttribute('data-billing') === 'annual'; bill.forEach(function(o){ o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); }); render(); }); });
  bands.forEach(function(b){ b.addEventListener('click', function(){
    var v = b.getAttribute('data-band'); st.custom = v === 'custom'; if (!st.custom) st.price = parseInt(v, 10);
    subEl.textContent = b.getAttribute('data-sub');
    bands.forEach(function(o){ o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); }); render();
  }); });
  render();
})();

(function(){
  document.querySelectorAll('.decision').forEach(function(row){
    row.querySelectorAll('[data-act]').forEach(function(b){
      b.addEventListener('click', function(){
        var ok = b.getAttribute('data-act') === 'approve';
        row.classList.add(ok ? 'is-approved' : 'is-dismissed');
        row.querySelector('.decision-state').textContent = ok ? 'Approved. You can roll it back for 24 hours.' : 'Dismissed. Nothing changed.';
      });
    });
  });
})();
</script>
