<!-- ============================================================
     TODAY'S INSIGHT: pulls the latest LinkedIn post via
     /assets/data/insight.json (written daily by a Make.com scenario;
     see docs/MAKE-COM-SETUP.md for the full pipeline).
     ============================================================ -->
<style>
.insight-section{padding:0 0 8px}
.insight-card{
  border:1px solid var(--line-strong);border-radius:16px;
  padding:26px 30px;display:flex;gap:22px;align-items:flex-start;
  position:relative;overflow:hidden;
}
.insight-badge{
  width:40px;height:40px;border-radius:10px;flex-shrink:0;
  background:#0A66C2;display:flex;align-items:center;justify-content:center;
}
.insight-badge svg{width:20px;height:20px}
.insight-body{flex:1;min-width:0}
.insight-top-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.insight-eyebrow{
  font-family: 'Inter', system-ui, sans-serif;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:7px;
}
.insight-eyebrow .live-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:insightPulse 1.8s ease-in-out infinite}
@keyframes insightPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.insight-date{font-family: 'Inter', system-ui, sans-serif;font-size:11px;color:var(--muted)}
.insight-text{font-size:15px;color:var(--ink);line-height:1.6;margin-bottom:12px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.insight-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.insight-link{
  font-family: 'Inter', system-ui, sans-serif;font-weight: 500;font-size:13.5px;color:var(--accent);
  text-decoration:none;display:inline-flex;align-items:center;gap:6px;
}
.insight-link:hover{text-decoration:underline}
.insight-updated{font-family: 'Inter', system-ui, sans-serif;font-size:10.5px;color:var(--muted)}
.insight-media{margin-bottom:14px}
.insight-media-img{width:100%;max-height:420px;object-fit:cover;border-radius:8px;display:block;border:1px solid var(--line-strong)}
.insight-pdf-viewer{border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--bg2)}
.insight-pdf-canvas-wrap{display:flex;align-items:center;justify-content:center;padding:14px;min-height:220px;overflow:auto;background:var(--bg3)}
.insight-pdf-canvas-wrap canvas{max-width:100%;height:auto;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.insight-pdf-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
.insight-pdf-btn{
  background:none;border:1px solid var(--line-strong);border-radius:6px;padding:7px 14px;cursor:pointer;
  font-family: 'Inter', system-ui, sans-serif;font-size:11px;color:var(--body);transition:border-color .15s,color .15s;
}
.insight-pdf-btn:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.insight-pdf-btn:disabled{opacity:.4;cursor:default}
.insight-pdf-page-label{font-family: 'Inter', system-ui, sans-serif;font-size:11px;color:var(--muted)}
@media(max-width:640px){
  .insight-card{flex-direction:column;padding:22px}
  .insight-foot{flex-direction:column;align-items:flex-start;gap:8px}
}
</style>
<section class="insight-section" id="insightSection" hidden>
  <div class="wrap">
        <div class="insight-card" id="insightCard">
      <div class="insight-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.03-1.85-3.03-1.85 0-2.14 1.44-2.14 2.94v5.66H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.11 20.45H3.56V9h3.55v11.45z"/></svg>
      </div>
      <div class="insight-body">
        <div class="insight-top-row">
          <span class="insight-eyebrow"><span class="live-dot"></span>Week's Insight</span>
          <span class="insight-date" id="insightDate"></span>
        </div>
        <p class="insight-text" id="insightText"></p>
        <div class="insight-media" id="insightMedia" style="display:none"></div>
        <div class="insight-foot">
          <a href="https://www.linkedin.com/company/7captur" target="_blank" rel="noopener" class="insight-link" id="insightLink">View the full post on LinkedIn &rarr;</a>
          <span class="insight-updated" id="insightUpdated"></span>
        </div>
      </div>
    </div>
  </div>
</section>
<script>
(function(){
  var textEl = document.getElementById('insightText');
  var dateEl = document.getElementById('insightDate');
  var linkEl = document.getElementById('insightLink');
  var updatedEl = document.getElementById('insightUpdated');
  var mediaEl = document.getElementById('insightMedia');

  var PDFJS_SRC = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
  var PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  var pdfjsLoadPromise = null;

  function loadPdfJs(){
    if (pdfjsLoadPromise) return pdfjsLoadPromise;
    pdfjsLoadPromise = new Promise(function(resolve, reject){
      if (window.pdfjsLib) { resolve(window.pdfjsLib); return; }
      var s = document.createElement('script');
      s.src = PDFJS_SRC;
      s.onload = function(){
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
        resolve(window.pdfjsLib);
      };
      s.onerror = function(){ reject(new Error('pdf.js failed to load')); };
      document.head.appendChild(s);
    });
    return pdfjsLoadPromise;
  }

  function renderImageMedia(url, alt){
    mediaEl.style.display = 'block';
    mediaEl.innerHTML = '';
    var img = document.createElement('img');
    img.className = 'insight-media-img';
    img.src = url;
    img.alt = alt || 'Image attached to the LinkedIn post';
    img.loading = 'lazy';
    mediaEl.appendChild(img);
  }

  function renderPdfMedia(url){
    mediaEl.style.display = 'block';
    mediaEl.innerHTML =
      '<div class="insight-pdf-viewer">' +
        '<div class="insight-pdf-canvas-wrap"><canvas id="insightPdfCanvas"></canvas></div>' +
        '<div class="insight-pdf-nav">' +
          '<button type="button" class="insight-pdf-btn" id="insightPdfPrev" disabled>&larr; Prev</button>' +
          '<span class="insight-pdf-page-label" id="insightPdfLabel">Loading document...</span>' +
          '<button type="button" class="insight-pdf-btn" id="insightPdfNext" disabled>Next &rarr;</button>' +
        '</div>' +
      '</div>';

    var canvas = document.getElementById('insightPdfCanvas');
    var ctx = canvas.getContext('2d');
    var prevBtn = document.getElementById('insightPdfPrev');
    var nextBtn = document.getElementById('insightPdfNext');
    var label = document.getElementById('insightPdfLabel');
    var pdfDoc = null;
    var currentPage = 1;

    function renderPage(num){
      pdfDoc.getPage(num).then(function(page){
        var viewport = page.getViewport({ scale: 1.4 });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        page.render({ canvasContext: ctx, viewport: viewport });
        label.textContent = 'Page ' + num + ' of ' + pdfDoc.numPages;
        prevBtn.disabled = (num <= 1);
        nextBtn.disabled = (num >= pdfDoc.numPages);
      });
    }

    loadPdfJs()
      .then(function(pdfjsLib){ return pdfjsLib.getDocument(url).promise; })
      .then(function(doc){
        pdfDoc = doc;
        currentPage = 1;
        renderPage(currentPage);
      })
      .catch(function(){
        label.textContent = 'Could not load the attached document.';
      });

    prevBtn.addEventListener('click', function(){
      if (currentPage > 1) { currentPage -= 1; renderPage(currentPage); }
    });
    nextBtn.addEventListener('click', function(){
      if (pdfDoc && currentPage < pdfDoc.numPages) { currentPage += 1; renderPage(currentPage); }
    });
  }

  fetch('/assets/data/insight.json', { cache: 'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('no insight.json'); return r.json(); })
    .then(function(data){
      if(!data || !data.text){ throw new Error('empty insight'); }
      textEl.textContent = data.text;
      document.getElementById('insightSection').hidden = false;
      if(data.url){ linkEl.href = data.url; }
      if(data.postedAt){
        var d = new Date(data.postedAt);
        if(!isNaN(d)){ dateEl.textContent = d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
      }
      if(data.updatedAt){
        var u = new Date(data.updatedAt);
        if(!isNaN(u)){ updatedEl.textContent = 'Updated ' + u.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
      }
      if(data.media && data.media.type === 'image' && data.media.url){
        renderImageMedia(data.media.url, data.media.alt);
      } else if(data.media && data.media.type === 'pdf' && data.media.url){
        renderPdfMedia(data.media.url);
      }
    })
    .catch(function(){ /* stays hidden */ });
})();
</script>
