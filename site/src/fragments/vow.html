



<section class="vow-section" id="video-of-the-week">
  <div class="wrap">
    <div class="vow-card" id="vowCard" style="display:none">
      <div class="vow-eyebrow">Video of the Month</div>
      <h2 class="vow-title" id="vowTitle"></h2>
      <div class="vow-embed-wrap" id="vowEmbedWrap"><iframe id="vowIframe" src="" title="Video of the Month" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
      <p class="vow-desc" id="vowDesc"></p>
    </div>
  </div>
</section>
<script>
(function(){
  fetch('/assets/data/video.json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('no video.json'); return r.json(); })
    .then(function(data){
      if(!data || !data.title){ return; }
      var isFile = data.source === 'file' && data.filePath;
      var isYoutube = (data.source === 'youtube' || !data.source) && data.youtubeId && data.youtubeId !== 'REPLACE_YOUTUBE_ID';
      if(!isFile && !isYoutube){ return; }

      document.getElementById('vowTitle').textContent = data.title || '';
      var wrap = document.getElementById('vowEmbedWrap');

      if(isYoutube){
        wrap.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + data.youtubeId + '" title="Video of the Month" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
      } else {
        var posterAttr = data.poster ? (' poster="' + data.poster + '"') : '';
        wrap.innerHTML = '<video controls preload="metadata"' + posterAttr + ' style="position:absolute;top:0;left:0;width:100%;height:100%;background:#000"><source src="' + data.filePath + '">Your browser does not support embedded video. <a href="' + data.filePath + '">Download the video instead.</a></video>';
      }

      if(data.description){ document.getElementById('vowDesc').textContent = data.description; }
      document.getElementById('vowCard').style.display = 'block';
    })
    .catch(function(){ /* stays hidden, no error shown */ });
})();
</script>
